{% extends "base.html" %}
{% block title %}Meals · Meal Shopper{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Meals</h1>
  <p class="actions"><a class="button" href="/meals/new">New meal</a></p>
</div>
<p>Every recipe is for two portions.</p>
<form
  class="filters"
  method="get"
  action="/meals"
  hx-get="/meals"
  hx-trigger="keyup changed delay:300ms from:input, change from:select"
  hx-target="#meal-results"
  hx-swap="outerHTML"
  hx-push-url="true"
>
  <div class="field">
    <label for="q">Search</label>
    <input id="q" name="q" type="search" value="{{ query }}" autocomplete="off">
  </div>
  <div class="field">
    <label for="status">Show</label>
    <select id="status" name="status">
      <option value="active" {% if status == "active" %}selected{% endif %}>Active</option>
      <option value="archived" {% if status == "archived" %}selected{% endif %}>Archived</option>
      <option value="all" {% if status == "all" %}selected{% endif %}>All</option>
    </select>
  </div>
  <button type="submit">Search</button>
</form>
{% include "partials/meal_results.html" %}
{% endblock %}
